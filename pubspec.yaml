name: dlg_app
description: Descifrando la Guerra - App móvil
publish_to: 'none'
version: 1.5.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cached_network_image: ^3.3.1
  provider: ^6.1.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.2.0
  flutter_inappwebview: ^6.0.0
  flutter_html: ^3.0.0
  youtube_player_flutter: ^9.1.1
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.0
  connectivity_plus: ^7.1.1
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  vector_math: ^2.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  connectivity_plus_platform_interface: ^2.0.1
  shared_preferences_platform_interface: ^2.4.2
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/regions/
    - assets/icons/

flutter_native_splash:
  color: "#0D0D0D"
  image: assets/images/splash_image_dark.png
  android_12:
    color: "#0D0D0D"
    image: assets/images/splash_image_dark.png
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_dlg_alfa.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_dlg_alfa.png"
  remove_alpha_ios: true